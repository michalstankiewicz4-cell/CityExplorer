# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sprawdź numer wersji
        run: node tools/check-version.mjs
      - name: Pobierz dane OSM (warszawa-centrum.json)
        continue-on-error: true
        timeout-minutes: 15
        run: node tools/fetch-osm.mjs
      - name: Pobierz dane OSM dla ?r=2000 (warszawa-r2000.json)
        continue-on-error: true
        timeout-minutes: 15
        run: node tools/fetch-osm.mjs 52.23175 21.00586 2000
      - name: Pobierz dane OSM lotniska Okęcie (okecie.json, ?map=okecie)
        continue-on-error: true
        timeout-minutes: 15
        run: node tools/fetch-osm.mjs 52.1657 20.9671 2000 okecie.json
      - name: Kafle Warszawy z poprzednich deployów (cache)
        uses: actions/cache/restore@v4
        with:
          path: tiles
          key: tiles-v1-${{ github.run_id }}
          restore-keys: tiles-v1-
      - name: Pobierz brakujące kafle Warszawy (tiles/, najpierw trasa centrum — Okęcie)
        continue-on-error: true
        timeout-minutes: 30
        env:
          TILE_MINUTES: 25
        run: node tools/fetch-tiles.mjs
      - name: Zapisz kafle (cache)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tiles
          key: tiles-v1-${{ github.run_id }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
